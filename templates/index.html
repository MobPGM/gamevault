<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #080810;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(8, 8, 16, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            color: white;
        }

        .logo span {
            color: #7c6ff7;
        }

        .stats {
            display: flex;
            gap: 24px;
        }

        .stat {
            text-align: center;
        }

        .stat .number {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .stat .label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .search-section {
            margin-bottom: 50px;
        }

        .search-title {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            max-width: 600px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #7c6ff7;
        }

        input[type="text"]::placeholder {
            color: #444;
        }

        .btn-primary {
            padding: 14px 24px;
            background: #7c6ff7;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn-primary:hover {
            background: #6a5de0;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #333;
            transform: none;
            cursor: not-allowed;
        }

        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 20px;
            max-width: 1000px;
        }

        .result-card {
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            background: #12121e;
        }

        .result-card:hover {
            transform: translateY(-4px);
            border-color: #7c6ff7;
        }

        .result-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }

        .result-card .rc-info {
            padding: 8px 10px;
        }

        .result-card .rc-info h3 {
            font-size: 12px;
            font-weight: 600;
            color: white;
            line-height: 1.3;
        }

        .result-card .rc-info p {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
        }

        .result-card .add-overlay {
            position: absolute;
            inset: 0;
            background: rgba(124, 111, 247, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .result-card:hover .add-overlay {
            opacity: 1;
        }

        .add-overlay span {
            background: #7c6ff7;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 800;
            color: white;
            letter-spacing: 0.5px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
        }

        .tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            background: transparent;
            color: #666;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .tab.active, .tab:hover {
            background: #7c6ff7;
            color: white;
            border-color: #7c6ff7;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .game-card {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            background: #12121e;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .no-cover {
            width: 100%;
            height: 160px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 11px;
        }

        .game-card .card-body {
            padding: 12px 14px 14px;
        }

        .game-card h3 {
            font-size: 13px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pill.playing {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .status-pill.completed {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .score {
            font-size: 16px;
            font-weight: 800;
            color: #7c6ff7;
        }

        .score span {
            font-size: 10px;
            font-weight: 400;
            color: #444;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            font-family: 'Inter', sans-serif;
            padding: 0;
        }

        .game-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.8);
            color: white;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #333;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #444;
        }

        .empty-state p {
            font-size: 13px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #12121e;
            border-radius: 18px;
            width: 380px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .modal-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-body h2 {
            font-size: 18px;
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
        }

        .modal-body .game-meta {
            font-size: 12px;
            color: #555;
            margin-bottom: 20px;
        }

        .modal-body label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .modal-body select,
        .modal-body input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: #080810;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .modal-body select:focus,
        .modal-body input[type="number"]:focus {
            border-color: #7c6ff7;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #666;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-cancel:hover {
            border-color: #444;
            color: #aaa;
        }

        .btn-add {
            flex: 2;
            padding: 12px;
            background: #7c6ff7;
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover { background: #6a5de0; }

        /* ── Stats cards ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 14px 0 0 14px;
        }

        .stat-card.purple::before { background: #7c6ff7; }
        .stat-card.green::before  { background: #34d399; }
        .stat-card.blue::before   { background: #60a5fa; }

        .sc-value {
            font-size: 26px;
            font-weight: 800;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-card.purple .sc-value { color: #9d94f7; }
        .stat-card.green .sc-value  { color: #34d399; }
        .stat-card.blue .sc-value   { color: #60a5fa; }

        .sc-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #444;
        }

        /* ── Library controls ── */
        .library-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .library-search {
            flex: 1;
            padding: 10px 16px;
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .library-search::placeholder { color: #444; }
        .library-search:focus { border-color: #7c6ff7; }

        .sort-select {
            padding: 10px 14px;
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .sort-select:focus { border-color: #7c6ff7; color: white; }

        /* ── Detail modal ── */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .detail-overlay.active {
            display: flex;
        }

        .detail-modal {
            background: #12121e;
            border-radius: 18px;
            width: 620px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #2a2a3e transparent;
        }

        .detail-modal::-webkit-scrollbar { width: 6px; }
        .detail-modal::-webkit-scrollbar-track { background: transparent; }
        .detail-modal::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }

        .detail-banner {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .detail-no-banner {
            width: 100%;
            height: 260px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 13px;
        }

        .detail-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.12);
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 0;
            transition: background 0.2s, color 0.2s;
            line-height: 1;
        }

        .detail-close:hover {
            background: rgba(0,0,0,0.85);
            color: white;
        }

        .detail-body {
            padding: 26px 28px 28px;
        }

        .detail-body h2 {
            font-size: 22px;
            font-weight: 800;
            color: white;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .detail-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: #888;
        }

        .detail-tag.year {
            background: rgba(124,111,247,0.15);
            color: #9d94f7;
        }

        .detail-description {
            font-size: 13px;
            color: #777;
            line-height: 1.75;
            margin-bottom: 24px;
            font-style: italic;
        }

        .detail-description.loading {
            color: #444;
            font-style: normal;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .detail-edit-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .detail-field {
            flex: 1;
        }

        .detail-body label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .detail-body select,
        .detail-body input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: #080810;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .detail-body select:focus,
        .detail-body input[type="number"]:focus {
            border-color: #7c6ff7;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">GAME<span>VAULT</span></div>
    <div class="stats">
        <div class="stat">
            <div class="number" id="totalCount">0</div>
            <div class="label">Total</div>
        </div>
        <div class="stat">
            <div class="number" id="completedCount">0</div>
            <div class="label">Completed</div>
        </div>
        <div class="stat">
            <div class="number" id="playingCount">0</div>
            <div class="label">Playing</div>
        </div>
    </div>
</header>

<div class="container">
    <div class="search-section">
        <p class="search-title">Add a Game</p>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search any game..." onkeydown="if(event.key==='Enter') searchGames()">
            <button class="btn-primary" onclick="searchGames()">Search</button>
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <div>
        <div class="section-header">
            <h2 class="section-title">My Library</h2>
            <div class="filter-tabs">
                <button class="tab active" onclick="filterLibrary('all', this)">All</button>
                <button class="tab" onclick="filterLibrary('playing', this)">Playing</button>
                <button class="tab" onclick="filterLibrary('completed', this)">Completed</button>
            </div>
        </div>
        <div class="stats-row">
            <div class="stat-card purple">
                <div class="sc-value" id="statAvgRating">—</div>
                <div class="sc-label">Avg Rating</div>
            </div>
            <div class="stat-card green">
                <div class="sc-value" id="statCompletion">—</div>
                <div class="sc-label">Completion Rate</div>
            </div>
            <div class="stat-card blue">
                <div class="sc-value" id="statTopGenre">—</div>
                <div class="sc-label">Top Genre</div>
            </div>
        </div>

        <div class="library-controls">
            <input type="text" class="library-search" id="librarySearch" placeholder="Search your library…" oninput="renderLibrary()">
            <select class="sort-select" id="sortSelect" onchange="renderLibrary()">
                <option value="rating">Sort: Rating</option>
                <option value="name">Sort: Name A–Z</option>
                <option value="year">Sort: Year</option>
                <option value="added">Sort: Recently Added</option>
            </select>
        </div>
        <div class="library-grid" id="libraryGrid"></div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <img class="modal-cover" id="modalCover" src="" alt="">
        <div class="modal-body">
            <h2 id="modalTitle"></h2>
            <p class="game-meta" id="modalMeta"></p>
            <label>Platform</label>
            <select id="modalPlatform">
                <option value="">Select platform…</option>
                <option value="PC">PC</option>
                <option value="PS5">PS5</option>
                <option value="PS4">PS4</option>
                <option value="Xbox Series X/S">Xbox Series X/S</option>
                <option value="Xbox One">Xbox One</option>
                <option value="Nintendo Switch">Nintendo Switch</option>
                <option value="Mobile">Mobile</option>
                <option value="Other">Other</option>
            </select>
            <label>Status</label>
            <select id="modalStatus">
                <option value="playing">Playing</option>
                <option value="completed">Completed</option>
            </select>
            <label>Your Score</label>
            <input type="number" id="modalRating" min="1" max="10" value="8" placeholder="1-10">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-add" onclick="addGame()">Add to Library</button>
            </div>
        </div>
    </div>
</div>

<div class="detail-overlay" id="detailOverlay">
    <div class="detail-modal" id="detailModal">
        <button class="detail-close" onclick="closeDetailModal()">×</button>
        <img class="detail-banner" id="detailBanner" alt="">
        <div class="detail-no-banner" id="detailNoBanner" style="display:none">No Image</div>
        <div class="detail-body">
            <h2 id="detailTitle"></h2>
            <div class="detail-tags" id="detailTags"></div>
            <p class="detail-description" id="detailDescription">Loading description…</p>
            <div class="detail-edit-row">
                <div class="detail-field">
                    <label>Status</label>
                    <select id="detailStatus">
                        <option value="playing">Playing</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="detail-field">
                    <label>Platform</label>
                    <select id="detailPlatform">
                        <option value="">—</option>
                        <option value="PC">PC</option>
                        <option value="PS5">PS5</option>
                        <option value="PS4">PS4</option>
                        <option value="Xbox Series X/S">Xbox Series X/S</option>
                        <option value="Xbox One">Xbox One</option>
                        <option value="Nintendo Switch">Nintendo Switch</option>
                        <option value="Mobile">Mobile</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="detail-field">
                    <label>Your Score</label>
                    <input type="number" id="detailRating" min="1" max="10">
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeDetailModal()">Close</button>
                <button class="btn-add" onclick="saveGameUpdate()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedGame = null;
    let selectedLibraryGame = null;
    let allGames = [];
    let currentFilter = 'all';

    async function searchGames() {
        const q = document.getElementById("searchInput").value.trim();
        if (!q) return;
        const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
        const games = await res.json();
        const container = document.getElementById("searchResults");
        container.innerHTML = "";
        games.forEach(game => {
            const card = document.createElement("div");
            card.className = "result-card";
            card.innerHTML = `
                ${game.cover ? `<img src="${game.cover}" onerror="this.style.display='none'">` : ''}
                <div class="add-overlay"><span>+ Add</span></div>
                <div class="rc-info">
                    <h3>${game.name}</h3>
                    <p>${game.year}</p>
                </div>
            `;
            card.onclick = () => openModal(game);
            container.appendChild(card);
        });
    }

    function openModal(game) {
        selectedGame = game;
        document.getElementById("modalCover").src = game.cover || "";
        document.getElementById("modalTitle").textContent = game.name;
        document.getElementById("modalMeta").textContent = `${game.year}${game.genre ? ' · ' + game.genre.split(',')[0] : ''}`;
        document.getElementById("modalOverlay").classList.add("active");
    }

    function closeModal() {
        document.getElementById("modalOverlay").classList.remove("active");
        selectedGame = null;
    }

    async function addGame() {
        if (!selectedGame) return;
        const payload = {
            ...selectedGame,
            rating: parseInt(document.getElementById("modalRating").value),
            status: document.getElementById("modalStatus").value,
            platform: document.getElementById("modalPlatform").value
        };
        await fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        closeModal();
        document.getElementById("searchResults").innerHTML = "";
        document.getElementById("searchInput").value = "";
        loadLibrary();
    }

    async function deleteGame(id, e) {
        e.stopPropagation();
        await fetch(`/delete/${id}`, { method: "DELETE" });
        loadLibrary();
    }

    function filterLibrary(status, btn) {
        currentFilter = status;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        renderLibrary();
    }

    function renderLibrary() {
        const grid = document.getElementById("libraryGrid");
        grid.innerHTML = "";

        const searchTerm = (document.getElementById("librarySearch")?.value || "").toLowerCase().trim();
        const sortBy = document.getElementById("sortSelect")?.value || "rating";

        // Stats always reflect the full library
        const total = allGames.length;
        const completed = allGames.filter(g => g.status === 'completed').length;
        const playing = allGames.filter(g => g.status === 'playing').length;
        document.getElementById("totalCount").textContent = total;
        document.getElementById("completedCount").textContent = completed;
        document.getElementById("playingCount").textContent = playing;

        // Stats cards
        if (total > 0) {
            const rated = allGames.filter(g => g.rating);
            const avg = rated.length
                ? (rated.reduce((s, g) => s + g.rating, 0) / rated.length).toFixed(1)
                : '—';
            document.getElementById("statAvgRating").textContent = avg;

            document.getElementById("statCompletion").textContent = `${Math.round((completed / total) * 100)}%`;

            const genreCounts = {};
            allGames.forEach(g => {
                if (g.genre) g.genre.split(', ').forEach(genre => {
                    genreCounts[genre] = (genreCounts[genre] || 0) + 1;
                });
            });
            const top = Object.entries(genreCounts).sort((a, b) => b[1] - a[1])[0];
            document.getElementById("statTopGenre").textContent = top ? top[0] : '—';
        } else {
            ['statAvgRating', 'statCompletion', 'statTopGenre'].forEach(id => {
                document.getElementById(id).textContent = '—';
            });
        }

        // Filter by status tab + search term
        let filtered = currentFilter === 'all' ? [...allGames] : allGames.filter(g => g.status === currentFilter);
        if (searchTerm) {
            filtered = filtered.filter(g => g.name.toLowerCase().includes(searchTerm));
        }

        // Sort
        filtered.sort((a, b) => {
            if (sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
            if (sortBy === 'name')   return a.name.localeCompare(b.name);
            if (sortBy === 'year')   return (b.year || '0').localeCompare(a.year || '0');
            if (sortBy === 'added')  return b.id - a.id;
            return 0;
        });

        if (filtered.length === 0) {
            grid.innerHTML = searchTerm
                ? `<div class="empty-state"><h3>No games found</h3><p>No results for "${searchTerm}"</p></div>`
                : `<div class="empty-state"><h3>Nothing here yet</h3><p>Search for a game above to add it</p></div>`;
            return;
        }

        filtered.forEach(game => {
            const card = document.createElement("div");
            card.className = "game-card";
            card.innerHTML = `
                <button class="delete-btn" onclick="deleteGame(${game.id}, event)">×</button>
                ${game.cover ? `<img src="${game.cover}" onerror="this.outerHTML='<div class=no-cover>No Image</div>'">` : '<div class="no-cover">No Image</div>'}
                <div class="card-body">
                    <h3>${game.name}</h3>
                    <div class="card-meta">
                        <span class="status-pill ${game.status}">${game.status}</span>
                        <span class="score">${game.rating}<span>/10</span></span>
                    </div>
                </div>
            `;
            card.onclick = () => openDetailModal(game);
            grid.appendChild(card);
        });
    }

    async function loadLibrary() {
        const res = await fetch("/library");
        allGames = await res.json();
        renderLibrary();
    }

    // ── Detail modal ──────────────────────────────────────────

    async function openDetailModal(game) {
        selectedLibraryGame = game;

        // Banner
        const banner = document.getElementById("detailBanner");
        const noBanner = document.getElementById("detailNoBanner");
        if (game.cover) {
            banner.src = game.cover;
            banner.style.display = "block";
            noBanner.style.display = "none";
        } else {
            banner.style.display = "none";
            noBanner.style.display = "flex";
        }

        // Title
        document.getElementById("detailTitle").textContent = game.name;

        // Tags
        const tags = [];
        if (game.year && game.year !== "Unknown") tags.push(`<span class="detail-tag year">${game.year}</span>`);
        if (game.genre) game.genre.split(", ").forEach(g => tags.push(`<span class="detail-tag">${g}</span>`));
        document.getElementById("detailTags").innerHTML = tags.join("");

        // Description — show loading state first
        const descEl = document.getElementById("detailDescription");
        if (game.description) {
            descEl.textContent = game.description;
            descEl.classList.remove("loading");
        } else {
            descEl.textContent = "Loading description…";
            descEl.classList.add("loading");
            // Fetch lazily
            try {
                const resp = await fetch(`/description/${game.id}`);
                const data = await resp.json();
                descEl.textContent = data.description || "No description available.";
                // Cache on the local object so repeat opens are instant
                const found = allGames.find(g => g.id === game.id);
                if (found) found.description = data.description;
            } catch {
                descEl.textContent = "No description available.";
            }
            descEl.classList.remove("loading");
        }

        // Editable fields
        document.getElementById("detailStatus").value = game.status;
        document.getElementById("detailPlatform").value = game.platform || "";
        document.getElementById("detailRating").value = game.rating;

        // Show platform as a tag if set
        if (game.platform) {
            document.getElementById("detailTags").innerHTML += `<span class="detail-tag" style="background:rgba(255,255,255,0.04);color:#7c6ff7">${game.platform}</span>`;
        }

        document.getElementById("detailOverlay").classList.add("active");
    }

    function closeDetailModal() {
        document.getElementById("detailOverlay").classList.remove("active");
        selectedLibraryGame = null;
    }

    async function saveGameUpdate() {
        if (!selectedLibraryGame) return;
        const payload = {
            status: document.getElementById("detailStatus").value,
            rating: parseInt(document.getElementById("detailRating").value),
            platform: document.getElementById("detailPlatform").value
        };
        await fetch(`/update/${selectedLibraryGame.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        closeDetailModal();
        loadLibrary();
    }

    // Close modals when clicking the dark backdrop
    document.getElementById("modalOverlay").addEventListener("click", function(e) {
        if (e.target === this) closeModal();
    });
    document.getElementById("detailOverlay").addEventListener("click", function(e) {
        if (e.target === this) closeDetailModal();
    });

    loadLibrary();
</script>

</body>
</html>
