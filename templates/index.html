<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #080810;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(8, 8, 16, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            color: white;
        }

        .logo span {
            color: #7c6ff7;
        }

        .stats {
            display: flex;
            gap: 24px;
        }

        .stat {
            text-align: center;
        }

        .stat .number {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .stat .label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .search-section {
            margin-bottom: 50px;
        }

        .search-title {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            max-width: 600px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #7c6ff7;
        }

        input[type="text"]::placeholder {
            color: #444;
        }

        .btn-primary {
            padding: 14px 24px;
            background: #7c6ff7;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn-primary:hover {
            background: #6a5de0;
        }

        .btn-primary:disabled {
            background: #333;
            transform: none;
            cursor: not-allowed;
        }

        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 20px;
            max-width: 1000px;
        }

        .result-card {
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: border-color 0.2s;
            position: relative;
            background: #12121e;
        }

        .result-card:hover {
            border-color: #7c6ff7;
        }

        .result-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }

        .result-card .rc-info {
            padding: 8px 10px;
        }

        .result-card .rc-info h3 {
            font-size: 12px;
            font-weight: 600;
            color: white;
            line-height: 1.3;
        }

        .result-card .rc-info p {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
        }

        .result-card .add-overlay {
            position: absolute;
            inset: 0;
            background: rgba(124, 111, 247, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .result-card:hover .add-overlay {
            opacity: 1;
        }

        .add-overlay span {
            background: #7c6ff7;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 800;
            color: white;
            letter-spacing: 0.5px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
        }

        .tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            background: transparent;
            color: #666;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .tab.active, .tab:hover {
            background: #7c6ff7;
            color: white;
            border-color: #7c6ff7;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .game-card {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            background: #12121e;
            position: relative;
            cursor: pointer;
            will-change: transform;
        }

        .game-card:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .no-cover {
            width: 100%;
            height: 160px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 11px;
        }

        .game-card .card-body {
            padding: 12px 14px 14px;
        }

        .game-card h3 {
            font-size: 13px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pill.playing {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .status-pill.completed {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .score {
            font-size: 16px;
            font-weight: 800;
            color: #7c6ff7;
        }

        .score span {
            font-size: 10px;
            font-weight: 400;
            color: #444;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            font-family: 'Inter', sans-serif;
            padding: 0;
        }

        .game-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.8);
            color: white;
        }

        /* ── Hero / scrolling banner ── */
        .hero-section {
            position: relative;
            height: 320px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080810;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .banner-strip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
        }

        .banner-track {
            display: flex;
            gap: 8px;
            height: 100%;
            align-items: stretch;
            width: max-content;
            animation: bannerScroll 55s linear infinite;
        }

        .banner-track:hover {
            animation-play-state: paused;
        }

        @keyframes bannerScroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        .banner-cover {
            width: 120px;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
            opacity: 0.35;
            transition: opacity 0.25s;
        }

        .banner-cover:hover { opacity: 0.65; }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                rgba(8,8,16,0.55) 0%,
                rgba(8,8,16,0.4)  50%,
                rgba(8,8,16,0.65) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 620px;
            padding: 0 24px;
        }

        .hero-content .search-title {
            color: rgba(255,255,255,0.55);
            text-shadow: 0 1px 8px rgba(0,0,0,0.8);
            margin-bottom: 16px;
        }

        .hero-content .search-bar {
            max-width: 100%;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
        }


        .platform-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.72);
            color: #ccc;
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #333;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #444;
        }

        .empty-state p {
            font-size: 13px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }


        .modal {
            background: #12121e;
            border-radius: 18px;
            width: 380px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .modal-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-body h2 {
            font-size: 18px;
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
        }

        .modal-body .game-meta {
            font-size: 12px;
            color: #555;
            margin-bottom: 20px;
        }

        .modal-body label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .modal-body select,
        .modal-body input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: #080810;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .modal-body select:focus,
        .modal-body input[type="number"]:focus {
            border-color: #7c6ff7;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #666;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-cancel:hover {
            border-color: #444;
            color: #aaa;
        }

        .btn-add {
            flex: 2;
            padding: 12px;
            background: #7c6ff7;
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover { background: #6a5de0; }

        /* ── Stats row ── */
        .stats-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 32px;
            padding: 28px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .stat-block {
            flex: 1;
            padding: 0 36px;
        }

        .stat-block:first-child { padding-left: 0; }
        .stat-block:last-child  { padding-right: 0; }

        .stat-divider {
            width: 1px;
            background: rgba(255,255,255,0.06);
            align-self: stretch;
        }

        .sc-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #3a3a4a;
            margin-bottom: 10px;
        }

        .sc-value {
            font-size: 52px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Library controls ── */
        .library-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .library-search {
            flex: 1;
            padding: 10px 16px;
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .library-search::placeholder { color: #444; }
        .library-search:focus { border-color: #7c6ff7; }

        .sort-select {
            padding: 10px 14px;
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #888;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .sort-select:focus { border-color: #7c6ff7; color: white; }

        /* ── Detail modal ── */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }


        .detail-modal {
            background: #12121e;
            border-radius: 18px;
            width: 620px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #2a2a3e transparent;
        }

        .detail-modal::-webkit-scrollbar { width: 6px; }
        .detail-modal::-webkit-scrollbar-track { background: transparent; }
        .detail-modal::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }

        .detail-banner {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .detail-no-banner {
            width: 100%;
            height: 260px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 13px;
        }

        .detail-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.12);
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 0;
            transition: background 0.2s, color 0.2s;
            line-height: 1;
        }

        .detail-close:hover {
            background: rgba(0,0,0,0.85);
            color: white;
        }

        .detail-body {
            padding: 26px 28px 28px;
        }

        .detail-body h2 {
            font-size: 22px;
            font-weight: 800;
            color: white;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .detail-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: #888;
        }

        .detail-tag.year {
            background: rgba(124,111,247,0.15);
            color: #9d94f7;
        }

        .detail-description {
            font-size: 13px;
            color: #777;
            line-height: 1.75;
            margin-bottom: 24px;
            font-style: italic;
        }

        .detail-description.loading {
            color: #444;
            font-style: normal;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .detail-edit-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .detail-field {
            flex: 1;
        }

        .detail-body label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .detail-body select,
        .detail-body input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: #080810;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .detail-body select:focus,
        .detail-body input[type="number"]:focus {
            border-color: #7c6ff7;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">GAME<span>VAULT</span></div>
    <div class="stats">
        <div class="stat">
            <div class="number" id="totalCount">0</div>
            <div class="label">Total</div>
        </div>
        <div class="stat">
            <div class="number" id="completedCount">0</div>
            <div class="label">Completed</div>
        </div>
        <div class="stat">
            <div class="number" id="playingCount">0</div>
            <div class="label">Playing</div>
        </div>
        <div class="stat">
            <div class="number" id="backlogCount">0</div>
            <div class="label">Backlog</div>
        </div>
    </div>
</header>

<div class="hero-section">
    <div class="banner-strip" id="bannerStrip">
        <div class="banner-track" id="bannerTrack"></div>
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <p class="search-title">Add a Game</p>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search any game…" onkeydown="if(event.key==='Enter') searchGames()">
            <button class="btn-primary" onclick="searchGames()">Search</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="search-results" id="searchResults" style="margin-bottom: 40px;"></div>

    <div>
        <div class="section-header">
            <h2 class="section-title">My Library</h2>
            <div class="filter-tabs">
                <button class="tab active" onclick="filterLibrary('all', this)">All</button>
                <button class="tab" onclick="filterLibrary('playing', this)">Playing</button>
                <button class="tab" onclick="filterLibrary('completed', this)">Completed</button>
            </div>
        </div>
        <div class="stats-row">
            <div class="stat-block">
                <div class="sc-label">Avg Rating</div>
                <div class="sc-value" id="statAvgRating">—</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-block">
                <div class="sc-label">Completion</div>
                <div class="sc-value" id="statCompletion">—</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-block">
                <div class="sc-label">Top Genre</div>
                <div class="sc-value" id="statTopGenre">—</div>
            </div>
        </div>

        <div class="library-controls">
            <input type="text" class="library-search" id="librarySearch" placeholder="Search your library…" oninput="renderLibrary()">
            <select class="sort-select" id="platformFilter" onchange="renderLibrary()">
                <option value="all">All Platforms</option>
            </select>
            <select class="sort-select" id="sortSelect" onchange="renderLibrary()">
                <option value="rating">Sort: Rating</option>
                <option value="name">Sort: Name A–Z</option>
                <option value="year">Sort: Year</option>
                <option value="added">Sort: Recently Added</option>
            </select>
        </div>
        <div class="library-grid" id="libraryGrid"></div>
    </div>

    <div id="backlogSection" style="margin-top: 60px; display: none;">
        <div class="section-header">
            <h2 class="section-title">Want to Play</h2>
            <span id="backlogHeaderCount" style="font-size:13px;color:#444;font-weight:500"></span>
        </div>
        <div class="library-grid" id="backlogGrid"></div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <img class="modal-cover" id="modalCover" src="" alt="">
        <div class="modal-body">
            <h2 id="modalTitle"></h2>
            <p class="game-meta" id="modalMeta"></p>
            <label>Platform</label>
            <select id="modalPlatform">
                <option value="">Select platform…</option>
                <option value="PC">PC</option>
                <option value="PS5">PS5</option>
                <option value="PS4">PS4</option>
                <option value="PS3">PS3</option>

<div class="detail-overlay" id="detailOverlay">
    <div class="detail-modal" id="detailModal">
        <button class="detail-close" onclick="closeDetailModal()">×</button>
        <img class="detail-banner" id="detailBanner" alt="">
        <div class="detail-no-banner" id="detailNoBanner" style="display:none">No Image</div>
        <div class="detail-body">
            <h2 id="detailTitle"></h2>
            <div class="detail-tags" id="detailTags"></div>
            <p class="detail-description" id="detailDescription">Loading description…</p>
            <div class="detail-edit-row">
                <div class="detail-field">
                    <label>Status</label>
                    <select id="detailStatus">
                        <option value="playing">Playing</option>
                        <option value="completed">Completed</option>
                        <option value="backlog">Want to Play</option>
                    </select>
                </div>
                <div class="detail-field">
                    <label>Platform</label>
                    <select id="detailPlatform">
                        <option value="">—</option>
                        <option value="PC">PC</option>
                        <option value="PS5">PS5</option>
                        <option value="PS4">PS4</option>
                        <option value="PS3">PS3</option>
                        <option value="Xbox Series X/S">Xbox Series X/S</option>
                        <option value="Xbox One">Xbox One</option>
                        <option value="Xbox 360">Xbox 360</option>
                        <option value="Nintendo Switch">Nintendo Switch</option>
                        <option value="Wii">Wii</option>
                        <option value="Wii U">Wii U</option>
                        <option value="Nintendo DS">Nintendo DS</option>
                        <option value="Nintendo 3DS">Nintendo 3DS</option>
                        <option value="Game Boy">Game Boy</option>
                        <option value="Game Boy Advance">Game Boy Advance</option>
                        <option value="PSP">PSP</option>
                        <option value="PS Vita">PS Vita</option>
                        <option value="Mobile">Mobile</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="detail-field">
                    <label>Your Score</label>
                    <input type="number" id="detailRating" min="1" max="10">
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeDetailModal()">Close</button>
                <button class="btn-add" onclick="saveGameUpdate()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { animate, stagger } from "https://cdn.jsdelivr.net/npm/motion@latest/+esm";

    // ─── State ────────────────────────────────────────────────────
    let selectedGame = null;
    let selectedLibraryGame = null;
    let allGames = [];
    let currentFilter = 'all';

    const PLATFORM_ABBR = {
        'Nintendo Switch':  'Switch',
        'Nintendo DS':      'NDS',
        'Nintendo 3DS':     '3DS',
        'Game Boy Advance': 'GBA',
        'Game Boy':         'GB',
        'Xbox Series X/S':  'Xbox X/S',
        'Xbox One':         'Xbox One',
        'Xbox 360':         'Xbox 360',
        'PS Vita':          'Vita',
    };
    function platformAbbr(p) { return PLATFORM_ABBR[p] || p; }

    // ─── Animation helpers ─────────────────────────────────────────
    function animateNumber(el, target, { suffix = '', decimals = 0 } = {}) {
        const raw = el.textContent.replace(/[^0-9.]/g, '');
        const start = parseFloat(raw) || 0;
        animate(start, target, {
            duration: 0.7,
            ease: [0.16, 1, 0.3, 1],
            onUpdate: v => {
                el.textContent = decimals > 0
                    ? v.toFixed(decimals) + suffix
                    : Math.round(v) + suffix;
            }
        });
    }

    function addCardHover(card) {
        card.addEventListener('mouseenter', () => {
            animate(card, { y: -8, scale: 1.02 }, { type: 'spring', stiffness: 280, damping: 18 });
        });
        card.addEventListener('mouseleave', () => {
            animate(card, { y: 0, scale: 1 }, { type: 'spring', stiffness: 300, damping: 26 });
        });
    }

    // ─── Overlay open / close with spring ─────────────────────────
    function openOverlay(overlay, panel) {
        overlay.style.display = 'flex';
        animate(overlay, { opacity: [0, 1] }, { duration: 0.22 });
        animate(panel, { opacity: [0, 1], scale: [0.94, 1], y: [16, 0] }, {
            type: 'spring', stiffness: 360, damping: 30
        });
    }

    async function closeOverlay(overlay, panel, cleanup) {
        await Promise.all([
            animate(overlay, { opacity: [1, 0] }, { duration: 0.18 }),
            animate(panel, { opacity: [1, 0], scale: [1, 0.96], y: [0, 8] }, { duration: 0.16 })
        ]);
        overlay.style.display = 'none';
        cleanup?.();
    }

    // ─── Search ────────────────────────────────────────────────────
    window.searchGames = async function() {
        const q = document.getElementById("searchInput").value.trim();
        if (!q) return;

        const btn = document.querySelector('.hero-content .btn-primary');
        animate(btn, { scale: [1, 0.93, 1] }, { duration: 0.28, ease: 'easeOut' });

        const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
        const games = await res.json();
        const container = document.getElementById("searchResults");
        container.innerHTML = "";
        const cards = [];
        games.forEach(game => {
            const card = document.createElement("div");
            card.className = "result-card";
            card.innerHTML = `
                ${game.cover ? `<img src="${game.cover}" onerror="this.style.display='none'">` : ''}
                <div class="add-overlay"><span>+ Add</span></div>
                <div class="rc-info">
                    <h3>${game.name}</h3>
                    <p>${game.year}</p>
                </div>
            `;
            card.onclick = () => openModal(game);
            container.appendChild(card);
            cards.push(card);
        });
        if (cards.length) {
            animate(cards, { opacity: [0, 1], y: [18, 0] }, {
                delay: stagger(0.055),
                type: 'spring', stiffness: 280, damping: 24
            });
        }
    };

    // ─── Add modal ─────────────────────────────────────────────────
    function openModal(game) {
        selectedGame = game;
        document.getElementById("modalCover").src = game.cover || "";
        document.getElementById("modalTitle").textContent = game.name;
        document.getElementById("modalMeta").textContent =
            `${game.year}${game.genre ? ' · ' + game.genre.split(',')[0] : ''}`;
        const overlay = document.getElementById("modalOverlay");
        openOverlay(overlay, overlay.querySelector('.modal'));
    }

    window.closeModal = async function() {
        const overlay = document.getElementById("modalOverlay");
        await closeOverlay(overlay, overlay.querySelector('.modal'), () => { selectedGame = null; });
    };

    window.addGame = async function() {
        if (!selectedGame) return;
        const payload = {
            ...selectedGame,
            rating: parseInt(document.getElementById("modalRating").value),
            status: document.getElementById("modalStatus").value,
            platform: document.getElementById("modalPlatform").value
        };
        const btn = document.querySelector('#modalOverlay .btn-add');
        if (btn) await animate(btn, { scale: [1, 0.93, 1] }, { duration: 0.22 });
        await fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        await window.closeModal();
        document.getElementById("searchResults").innerHTML = "";
        document.getElementById("searchInput").value = "";
        loadLibrary();
    };

    // ─── Delete ────────────────────────────────────────────────────
    window.deleteGame = async function(id, e) {
        e.stopPropagation();
        const card = e.target.closest('.game-card');
        if (card) {
            await animate(card, { opacity: [1, 0], scale: [1, 0.82], y: [0, -8] }, {
                duration: 0.2, ease: 'easeIn'
            });
        }
        await fetch(`/delete/${id}`, { method: "DELETE" });
        loadLibrary();
    };

    // ─── Filter tabs ────────────────────────────────────────────────
    window.filterLibrary = function(status, btn) {
        currentFilter = status;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        animate(btn, { scale: [1, 0.88, 1.05, 1] }, { duration: 0.38, ease: 'easeOut' });
        renderLibrary();
    };

    // ─── Render library ────────────────────────────────────────────
    function renderLibrary() {
        const grid = document.getElementById("libraryGrid");
        grid.innerHTML = "";

        const searchTerm = (document.getElementById("librarySearch")?.value || "").toLowerCase().trim();
        const platformFilter = document.getElementById("platformFilter")?.value || "all";
        const sortBy = document.getElementById("sortSelect")?.value || "rating";

        // Header stat count-ups
        const total     = allGames.length;
        const completed = allGames.filter(g => g.status === 'completed').length;
        const playing   = allGames.filter(g => g.status === 'playing').length;
        const backlog   = allGames.filter(g => g.status === 'backlog').length;
        animateNumber(document.getElementById("totalCount"),     total);
        animateNumber(document.getElementById("completedCount"), completed);
        animateNumber(document.getElementById("playingCount"),   playing);
        animateNumber(document.getElementById("backlogCount"),   backlog);

        // Big stat blocks
        if (total > 0) {
            const rated = allGames.filter(g => g.rating);
            const avg = rated.length
                ? rated.reduce((s, g) => s + g.rating, 0) / rated.length
                : 0;
            const avgEl = document.getElementById("statAvgRating");
            if (avg > 0) animateNumber(avgEl, avg, { decimals: 1 });
            else avgEl.textContent = '—';

            animateNumber(
                document.getElementById("statCompletion"),
                Math.round((completed / total) * 100),
                { suffix: '%' }
            );

            const genreCounts = {};
            allGames.forEach(g => {
                if (g.genre) g.genre.split(', ').forEach(genre => {
                    genreCounts[genre] = (genreCounts[genre] || 0) + 1;
                });
            });
            const top = Object.entries(genreCounts).sort((a, b) => b[1] - a[1])[0];
            const genreEl = document.getElementById("statTopGenre");
            const newGenre = top ? top[0] : '—';
            if (genreEl.textContent !== newGenre) {
                genreEl.textContent = newGenre;
                animate(genreEl, { opacity: [0, 1], y: [10, 0] }, { duration: 0.4, ease: 'easeOut' });
            }
        } else {
            ['statAvgRating', 'statCompletion', 'statTopGenre'].forEach(id => {
                document.getElementById(id).textContent = '—';
            });
        }

        // Filter
        const libraryGames = allGames.filter(g => g.status !== 'backlog');
        let filtered = currentFilter === 'all'
            ? [...libraryGames]
            : libraryGames.filter(g => g.status === currentFilter);
        if (platformFilter !== 'all') filtered = filtered.filter(g => g.platform === platformFilter);
        if (searchTerm)              filtered = filtered.filter(g => g.name.toLowerCase().includes(searchTerm));

        filtered.sort((a, b) => {
            if (sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
            if (sortBy === 'name')   return a.name.localeCompare(b.name);
            if (sortBy === 'year')   return (b.year || '0').localeCompare(a.year || '0');
            if (sortBy === 'added')  return b.id - a.id;
            return 0;
        });

        if (filtered.length === 0) {
            grid.innerHTML = searchTerm
                ? `<div class="empty-state"><h3>No games found</h3><p>No results for "${searchTerm}"</p></div>`
                : `<div class="empty-state"><h3>Nothing here yet</h3><p>Search for a game above to add it</p></div>`;
            return;
        }

        const cards = [];
        filtered.forEach(game => {
            const card = document.createElement("div");
            card.className = "game-card";
            card.innerHTML = `
                <button class="delete-btn" onclick="deleteGame(${game.id}, event)">×</button>
                ${game.platform ? `<span class="platform-badge">${platformAbbr(game.platform)}</span>` : ''}
                ${game.cover ? `<img src="${game.cover}" onerror="this.outerHTML='<div class=no-cover>No Image</div>'">` : '<div class="no-cover">No Image</div>'}
                <div class="card-body">
                    <h3>${game.name}</h3>
                    <div class="card-meta">
                        <span class="status-pill ${game.status}">${game.status}</span>
                        <span class="score">${game.rating}<span>/10</span></span>
                    </div>
                </div>
            `;
            card.onclick = () => openDetailModal(game);
            addCardHover(card);
            grid.appendChild(card);
            cards.push(card);
        });

        if (cards.length) {
            animate(cards, { opacity: [0, 1], y: [22, 0] }, {
                delay: stagger(0.05, { startDelay: 0.03 }),
                type: 'spring', stiffness: 260, damping: 24
            });
        }
    }

    // ─── Banner ────────────────────────────────────────────────────
    function renderBanner() {
        const covers = allGames.map(g => g.cover).filter(Boolean);
        const track = document.getElementById("bannerTrack");
        if (covers.length === 0) { track.innerHTML = ""; return; }
        let images = [...covers];
        while (images.length < 14) images = [...images, ...covers];
        track.innerHTML = [...images, ...images]
            .map(src => `<img class="banner-cover" src="${src}" onerror="this.style.display='none'">`)
            .join("");
    }

    // ─── Backlog ───────────────────────────────────────────────────
    function renderBacklog() {
        const games = allGames.filter(g => g.status === 'backlog');
        const section = document.getElementById("backlogSection");
        const grid    = document.getElementById("backlogGrid");

        section.style.display = games.length > 0 ? 'block' : 'none';
        document.getElementById("backlogHeaderCount").textContent =
            `${games.length} game${games.length !== 1 ? 's' : ''}`;
        grid.innerHTML = "";

        const cards = [];
        games.forEach(game => {
            const card = document.createElement("div");
            card.className = "game-card";
            card.innerHTML = `
                <button class="delete-btn" onclick="deleteGame(${game.id}, event)">×</button>
                ${game.platform ? `<span class="platform-badge">${platformAbbr(game.platform)}</span>` : ''}
                ${game.cover ? `<img src="${game.cover}" onerror="this.outerHTML='<div class=no-cover>No Image</div>'">` : '<div class="no-cover">No Image</div>'}
                <div class="card-body">
                    <h3>${game.name}</h3>
                    <div class="card-meta">
                        <span style="font-size:11px;color:#555">${game.year || ''}${game.genre ? ' · ' + game.genre.split(', ')[0] : ''}</span>
                    </div>
                </div>
            `;
            card.onclick = () => openDetailModal(game);
            addCardHover(card);
            grid.appendChild(card);
            cards.push(card);
        });

        if (cards.length) {
            animate(cards, { opacity: [0, 1], y: [22, 0] }, {
                delay: stagger(0.05, { startDelay: 0.03 }),
                type: 'spring', stiffness: 260, damping: 24
            });
        }
    }

    // ─── Platform filter ───────────────────────────────────────────
    function updatePlatformOptions() {
        const select = document.getElementById("platformFilter");
        const current = select.value;
        const platforms = [...new Set(allGames.map(g => g.platform).filter(p => p))].sort();
        select.innerHTML = '<option value="all">All Platforms</option>';
        platforms.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p; opt.textContent = p;
            select.appendChild(opt);
        });
        if (platforms.includes(current)) select.value = current;
    }

    // ─── Load ──────────────────────────────────────────────────────
    async function loadLibrary() {
        const res = await fetch("/library");
        allGames = await res.json();
        updatePlatformOptions();
        renderBanner();
        renderLibrary();
        renderBacklog();
    }

    // ─── Detail modal ──────────────────────────────────────────────
    async function openDetailModal(game) {
        selectedLibraryGame = game;

        const banner   = document.getElementById("detailBanner");
        const noBanner = document.getElementById("detailNoBanner");
        if (game.cover) {
            banner.src = game.cover;
            banner.style.display = "block";
            noBanner.style.display = "none";
        } else {
            banner.style.display = "none";
            noBanner.style.display = "flex";
        }

        document.getElementById("detailTitle").textContent = game.name;

        const tags = [];
        if (game.year && game.year !== "Unknown")
            tags.push(`<span class="detail-tag year">${game.year}</span>`);
        if (game.genre)
            game.genre.split(", ").forEach(g => tags.push(`<span class="detail-tag">${g}</span>`));
        document.getElementById("detailTags").innerHTML = tags.join("");

        const descEl = document.getElementById("detailDescription");
        if (game.description) {
            descEl.textContent = game.description;
            descEl.classList.remove("loading");
        } else {
            descEl.textContent = "Loading description…";
            descEl.classList.add("loading");
            try {
                const resp = await fetch(`/description/${game.id}`);
                const data = await resp.json();
                descEl.textContent = data.description || "No description available.";
                const found = allGames.find(g => g.id === game.id);
                if (found) found.description = data.description;
            } catch {
                descEl.textContent = "No description available.";
            }
            descEl.classList.remove("loading");
        }

        document.getElementById("detailStatus").value   = game.status;
        document.getElementById("detailPlatform").value = game.platform || "";
        document.getElementById("detailRating").value   = game.rating;

        if (game.platform) {
            document.getElementById("detailTags").innerHTML +=
                `<span class="detail-tag" style="background:rgba(255,255,255,0.04);color:#7c6ff7">${game.platform}</span>`;
        }

        const overlay = document.getElementById("detailOverlay");
        openOverlay(overlay, overlay.querySelector('.detail-modal'));
    }

    window.closeDetailModal = async function() {
        const overlay = document.getElementById("detailOverlay");
        await closeOverlay(overlay, overlay.querySelector('.detail-modal'), () => {
            selectedLibraryGame = null;
        });
    };

    window.saveGameUpdate = async function() {
        if (!selectedLibraryGame) return;
        const payload = {
            status:   document.getElementById("detailStatus").value,
            rating:   parseInt(document.getElementById("detailRating").value),
            platform: document.getElementById("detailPlatform").value
        };
        const btn = document.querySelector('#detailOverlay .btn-add');
        if (btn) await animate(btn, { scale: [1, 0.93, 1] }, { duration: 0.22 });
        await fetch(`/update/${selectedLibraryGame.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        await window.closeDetailModal();
        loadLibrary();
    };

    // ─── Backdrop click ────────────────────────────────────────────
    document.getElementById("modalOverlay").addEventListener("click", function(e) {
        if (e.target === this) window.closeModal();
    });
    document.getElementById("detailOverlay").addEventListener("click", function(e) {
        if (e.target === this) window.closeDetailModal();
    });

    // ─── Page entrance animations ──────────────────────────────────
    animate('header', { opacity: [0, 1], y: [-10, 0] }, { duration: 0.5, ease: 'easeOut' });

    const heroTitle = document.querySelector('.hero-content .search-title');
    const heroBar   = document.querySelector('.hero-content .search-bar');
    if (heroTitle && heroBar) {
        animate([heroTitle, heroBar], { opacity: [0, 1], y: [20, 0] }, {
            delay: stagger(0.13),
            type: 'spring', stiffness: 240, damping: 22
        });
    }

    // ─── Init ──────────────────────────────────────────────────────
    loadLibrary();
</script>

</body>
